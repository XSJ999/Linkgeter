name: Video Downloader - No Login Required

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      quality:
        description: 'Video quality (yt-dlp format selector)'
        required: false
        type: string
        default: 'bestvideo[height<=720]+bestaudio/best[ext=mp4]/best'
      archive_name:
        description: 'Base name for the RAR archive (if file is split)'
        required: false
        type: string
        default: 'video'
      split_threshold_mb:
        description: 'Split files larger than this value (MB)'
        required: false
        type: string
        default: '99'
      split_size_mb:
        description: 'Size of each RAR part (MB)'
        required: false
        type: string
        default: '95'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Remove cache line to avoid requirements.txt error
          # cache: 'pip'  # <-- THIS LINE CAUSED THE ERROR

      - name: Install dependencies
        run: |
          python --version
          pip --version
          pip install --upgrade pip
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y bc rar
          echo "✅ yt-dlp version:"
          yt-dlp --version

      - name: Download video (no login required)
        id: download
        run: |
          set -euo pipefail
          
          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"
          
          # Create timestamp marker for file detection
          TIMESTAMP_MARKER=$(mktemp)
          touch "$TIMESTAMP_MARKER"
          
          MAX_RETRIES=5
          RETRY_COUNT=0
          DOWNLOAD_SUCCESS=false
          NEW_FILE=""
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$DOWNLOAD_SUCCESS" = false ]; do
            echo "========================================="
            echo "Download attempt $((RETRY_COUNT+1))/$MAX_RETRIES"
            echo "========================================="
            
            touch "$TIMESTAMP_MARKER"
            
            # Determine which API strategy to use based on retry count
            case $RETRY_COUNT in
              0)
                echo "🔄 Strategy 1: Standard download with browser impersonation"
                IMPERSONATE="--impersonate chrome"
                ;;
              1)
                echo "🔄 Strategy 2: Using legacy API"
                IMPERSONATE="--impersonate chrome"
                EXTRACTOR_ARGS="--extractor-args \"youtube:player-client=web\""
                ;;
              2)
                echo "🔄 Strategy 3: Using mobile client (less restrictions)"
                IMPERSONATE="--impersonate safari"
                EXTRACTOR_ARGS="--extractor-args \"youtube:player-client=android\""
                ;;
              3)
                echo "🔄 Strategy 4: No impersonation, standard headers"
                IMPERSONATE=""
                EXTRACTOR_ARGS=""
                ;;
              *)
                echo "🔄 Strategy 5: Force IPv4 and skip DASH"
                IMPERSONATE="--impersonate chrome"
                EXTRACTOR_ARGS="--extractor-args \"youtube:skip=hls,dash\""
                FORCE_IPV4="--force-ipv4"
                ;;
            esac
            
            # Attempt download with anonymous-friendly options
            if yt-dlp \
              --output "./$FOLDER/%(uploader)s - %(title)s - %(id)s.%(ext)s" \
              --format "${{ github.event.inputs.quality }}" \
              --merge-output-format mp4 \
              --retries 5 \
              --fragment-retries 10 \
              --no-check-certificate \
              --geo-bypass \
              --no-color \
              --progress \
              --no-overwrites \
              --continue \
              --no-cookies \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              $IMPERSONATE \
              ${FORCE_IPV4:-} \
              ${EXTRACTOR_ARGS:-} \
              "${{ github.event.inputs.url }}" 2>&1; then
              
              # Find files created after the timestamp marker
              NEW_FILE=$(find "$FOLDER" -type f -newer "$TIMESTAMP_MARKER" ! -name "*.part" ! -name "*.rar" -print -quit 2>/dev/null || true)
              
              if [ -n "$NEW_FILE" ] && [ -f "$NEW_FILE" ]; then
                echo "✅ Download succeeded: $(basename "$NEW_FILE")"
                DOWNLOAD_SUCCESS=true
                break
              else
                echo "⚠️ Download command succeeded but no new file was detected"
                # Check if any file exists in folder
                EXISTING_FILES=$(find "$FOLDER" -type f ! -name "*.part" ! -name "*.rar" | head -1)
                if [ -n "$EXISTING_FILES" ]; then
                  echo "ℹ️ Using most recent existing file: $(basename "$EXISTING_FILES")"
                  NEW_FILE="$EXISTING_FILES"
                  DOWNLOAD_SUCCESS=true
                  break
                fi
              fi
            else
              DOWNLOAD_EXIT_CODE=$?
              echo "❌ Download attempt failed with exit code: $DOWNLOAD_EXIT_CODE"
              
              # Check for login required error
              if [ $DOWNLOAD_EXIT_CODE -eq 101 ]; then
                echo "⚠️ Login wall detected - trying alternative strategy on next retry"
              fi
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$DOWNLOAD_SUCCESS" = false ]; then
              WAIT_TIME=$((RETRY_COUNT * 5))
              echo "Waiting $WAIT_TIME seconds before next attempt..."
              sleep $WAIT_TIME
            fi
            
            # Reset variables for next iteration
            FORCE_IPV4=""
            EXTRACTOR_ARGS=""
          done
          
          if [ "$DOWNLOAD_SUCCESS" = false ] || [ -z "$NEW_FILE" ] || [ ! -f "$NEW_FILE" ]; then
            echo "❌ Error: All $MAX_RETRIES download attempts failed."
            echo ""
            echo "💡 TIPS FOR ANONYMOUS DOWNLOADS:"
            echo "   - Some age-restricted videos cannot be downloaded without login"
            echo "   - YouTube may block datacenter IPs (GitHub Actions uses datacenter IPs)"
            echo "   - Try a different quality setting or video source"
            echo "   - Check if the video URL is valid and accessible"
            exit 1
          fi
          
          # Get file information
          FILENAME=$(basename "$NEW_FILE")
          SIZE_BYTES=$(stat -c %s "$NEW_FILE" 2>/dev/null || stat -f %z "$NEW_FILE" 2>/dev/null)
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          
          echo "📁 File: $FILENAME"
          echo "📊 Size: $SIZE_MB MB ($SIZE_BYTES bytes)"
          
          # Set outputs
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "file_path=$NEW_FILE" >> $GITHUB_OUTPUT
          
          # Clean up
          rm -f "$TIMESTAMP_MARKER"
          
        shell: bash

      - name: Conditional split based on file size
        id: split
        run: |
          set -euo pipefail
          
          FOLDER="${{ github.event.inputs.output_folder }}"
          FILE_PATH="${{ steps.download.outputs.file_path }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          SIZE_MB="${{ steps.download.outputs.size_mb }}"
          
          # Validate inputs
          if [ -z "$FILE_PATH" ] || [ ! -f "$FILE_PATH" ]; then
            echo "❌ Error: File not found at path: $FILE_PATH"
            exit 1
          fi
          
          THRESHOLD_MB="${{ github.event.inputs.split_threshold_mb }}"
          SPLIT_SIZE_MB="${{ github.event.inputs.split_size_mb }}"
          
          # Ensure numeric comparison
          if ! [[ "$SIZE_MB" =~ ^[0-9]+\.?[0-9]*$ ]] || ! [[ "$THRESHOLD_MB" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: Invalid numeric values"
            echo "Size: $SIZE_MB, Threshold: $THRESHOLD_MB"
            exit 1
          fi
          
          echo "📊 File size: ${SIZE_MB} MB"
          echo "⚙️ Split threshold: ${THRESHOLD_MB} MB"
          
          cd "$FOLDER"
          
          # Use bc for floating point comparison
          if (( $(echo "$SIZE_MB > $THRESHOLD_MB" | bc -l) )); then
            echo "🔪 File size exceeds threshold - splitting into ${SPLIT_SIZE_MB} MB RAR parts"
            
            # Generate unique archive name with timestamp and random suffix
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            RANDOM_HEX=$(openssl rand -hex 3 2>/dev/null || echo "000000")
            ARCHIVE_NAME="${{ github.event.inputs.archive_name }}_${TIMESTAMP}_${RANDOM_HEX}"
            
            echo "📦 Archive base name: $ARCHIVE_NAME"
            
            # Create RAR archive with error checking
            if rar a -v${SPLIT_SIZE_MB}m -m5 -ep1 -r -idp "${ARCHIVE_NAME}.rar" "$FILENAME" 2>&1; then
              # Verify that parts were created
              RAR_PARTS=$(ls -1 "${ARCHIVE_NAME}.part"*.rar 2>/dev/null | wc -l)
              
              if [ $RAR_PARTS -gt 0 ]; then
                echo "✅ Split completed successfully"
                echo "📦 Created $RAR_PARTS RAR parts"
                ls -lh "${ARCHIVE_NAME}.part"*.rar 2>/dev/null || ls -lh "${ARCHIVE_NAME}.rar" 2>/dev/null
                # Remove original file only after successful split
                rm -f "$FILENAME"
                echo "🗑️ Original file removed"
                echo "split_done=true" >> $GITHUB_OUTPUT
                echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
                echo "parts_count=$RAR_PARTS" >> $GITHUB_OUTPUT
              else
                echo "⚠️ RAR command succeeded but no parts were created"
                echo "split_done=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "❌ RAR compression failed - keeping original file"
              echo "split_done=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ File size (${SIZE_MB} MB) is ≤ threshold (${THRESHOLD_MB} MB) - keeping original"
            echo "split_done=false" >> $GITHUB_OUTPUT
          fi
          
        shell: bash

      - name: Commit and push changes
        run: |
          set -euo pipefail
          
          FOLDER="${{ github.event.inputs.output_folder }}"
          
          # Check if there are changes to commit
          if [ -z "$(git status --porcelain "$FOLDER/")" ]; then
            echo "ℹ️ No changes to commit in $FOLDER/"
            exit 0
          fi
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Prepare commit message with metadata
          COMMIT_MSG="Add downloaded video(s)
          
          - Source: ${{ github.event.inputs.url }}
          - Quality: ${{ github.event.inputs.quality }}
          - Split: ${{ steps.split.outputs.split_done }}
          - Anonymous download: true
          - Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - Run ID: ${{ github.run_id }}"
          
          # Add and commit
          git add "$FOLDER/"
          git commit -m "$COMMIT_MSG"
          
          # Push with retry on remote changes
          MAX_PUSH_RETRIES=3
          PUSH_RETRY=0
          PUSH_SUCCESS=false
          
          while [ $PUSH_RETRY -lt $MAX_PUSH_RETRIES ] && [ "$PUSH_SUCCESS" = false ]; do
            if git pull --rebase origin ${{ github.ref_name }} 2>/dev/null; then
              if git push origin ${{ github.ref_name }}; then
                echo "✅ Successfully pushed to repository"
                PUSH_SUCCESS=true
                break
              fi
            fi
            
            PUSH_RETRY=$((PUSH_RETRY + 1))
            if [ $PUSH_RETRY -lt $MAX_PUSH_RETRIES ]; then
              echo "⚠️ Push failed, retrying in 5 seconds... (Attempt $PUSH_RETRY/$MAX_PUSH_RETRIES)"
              sleep 5
            fi
          done
          
          if [ "$PUSH_SUCCESS" = false ]; then
            echo "❌ Failed to push after $MAX_PUSH_RETRIES attempts"
            exit 1
          fi
          
        shell: bash

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Video URL** | ${{ github.event.inputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Quality** | ${{ github.event.inputs.quality }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Name** | ${{ steps.download.outputs.filename }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Size** | ${{ steps.download.outputs.size_mb }} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| **Split Performed** | ${{ steps.split.outputs.split_done }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Authentication** | None (Anonymous) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.split.outputs.split_done }}" = "true" ]; then
            echo "| **Archive Name** | ${{ steps.split.outputs.archive_name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Parts Count** | ${{ steps.split.outputs.parts_count }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Status** | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔓 Anonymous Download Notes" >> $GITHUB_STEP_SUMMARY
          echo "- No login or cookies were used" >> $GITHUB_STEP_SUMMARY
          echo "- Multiple API strategies attempted automatically" >> $GITHUB_STEP_SUMMARY
          echo "- Some age-restricted content may require authentication" >> $GITHUB_STEP_SUMMARY
          
        shell: bash
