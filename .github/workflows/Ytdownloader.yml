name: YOUTUBE

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

      output_format:
        description: 'نوع خروجی'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      video_quality:
        description: 'کیفیت ویدیو (فقط برای mp4)'
        required: false
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - '360'
          - 'best'
        default: '720'

      audio_quality:
        description: 'کیفیت صدا (فقط برای mp3)'
        required: false
        type: choice
        options:
          - '320'
          - '192'
          - '128'
          - '64'
        default: '192'

permissions:
  contents: write

jobs:
  youtube-download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q -U yt-dlp

      - name: Download YouTube video
        run: |
          URL="${{ github.event.inputs.video_url }}"
          FORMAT="${{ github.event.inputs.output_format }}"
          VIDEO_Q="${{ github.event.inputs.video_quality }}"
          AUDIO_Q="${{ github.event.inputs.audio_quality }}"

          mkdir -p YouTube

          if [ "$FORMAT" = "mp3 (audio only)" ]; then
            yt-dlp \
              -x \
              --audio-format mp3 \
              --audio-quality "${AUDIO_Q}K" \
              -o "YouTube/%(title)s.%(ext)s" \
              "$URL"
          else
            if [ "$VIDEO_Q" = "best" ]; then
              yt-dlp \
                -f "bestvideo+bestaudio" \
                --merge-output-format mp4 \
                -o "YouTube/%(title)s.%(ext)s" \
                "$URL"
            else
              yt-dlp \
                -f "bestvideo[height<=${VIDEO_Q}]+bestaudio" \
                --merge-output-format mp4 \
                -o "YouTube/%(title)s.%(ext)s" \
                "$URL"
            fi
          fi

      - name: Push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add YouTube/
          git commit -m "Download YouTube video [skip ci]" || echo "Nothing to commit"
          git push
