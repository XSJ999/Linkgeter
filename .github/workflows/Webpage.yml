name: عکس از صفحه وب (سریع)

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'لینک صفحه وب'
        required: true
        type: string
      search_name:
        description: 'اسم جستجو'
        required: true
        type: string

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cutycapt
        run: |
          sudo apt-get update
          sudo apt-get install -y cutycapt xvfb

      - name: Take screenshot
        run: |
          URL="${{ github.event.inputs.page_url }}"
          NAME="${{ github.event.inputs.search_name }}"
          
          mkdir -p webresult
          SAFE_NAME=$(echo "$NAME" | tr ' ' '_' | sed 's/[^a-zA-Z0-9_-]//g')
          
          xvfb-run cutycapt --url="$URL" --out="webresult/${SAFE_NAME}.png"
          
          echo "✅ عکس ذخیره شد: webresult/${SAFE_NAME}.png"

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git add webresult/
          git commit -m "Add screenshot" || echo "Nothing to commit"
          git push
