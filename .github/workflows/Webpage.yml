name: عکس از صفحه وب

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'لینک صفحه وب'
        required: true
        type: string
      search_name:
        description: 'اسم جستجو (برای نام عکس)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright
        run: |
          sudo apt-get update
          pip install playwright
          playwright install chromium

      - name: Take screenshot
        run: |
          URL="${{ github.event.inputs.page_url }}"
          NAME="${{ github.event.inputs.search_name }}"
          
          mkdir -p webresult
          SAFE_NAME=$(echo "$NAME" | sed 's/[^a-zA-Z0-9\-_]//g' | sed 's/ /_/g')
          
          echo "🌐 در حال گرفتن عکس از: $URL"
          
          python3 << EOF
          from playwright.sync_api import sync_playwright
          
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True, 
                  args=['--no-sandbox', '--disable-setuid-sandbox']
              )
              page = browser.new_page(viewport={'width': 1280, 'height': 800})
              
              try:
                  page.goto("$URL", wait_until="networkidle", timeout=30000)
                  page.screenshot(
                      path="webresult/${SAFE_NAME}.png",
                      full_page=True
                  )
                  print(f"✅ عکس ذخیره شد: webresult/${SAFE_NAME}.png")
              except Exception as e:
                  print(f"❌ خطا: {e}")
                  # تلاش دوباره با wait_until کمتر
                  page.goto("$URL", wait_until="domcontentloaded", timeout=30000)
                  page.screenshot(
                      path="webresult/${SAFE_NAME}.png",
                      full_page=True
                  )
                  print(f"✅ عکس با روش جایگزین ذخیره شد")
              finally:
                  browser.close()
          EOF
          
          # نمایش حجم فایل
          echo "📁 حجم: $(du -h "webresult/${SAFE_NAME}.png" | cut -f1)"

      - name: Push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webresult/
          git commit -m "Add webpage screenshot [skip ci]" || echo "Nothing to commit"
          git push
