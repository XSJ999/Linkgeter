name: استخراج لینک تیک‌تاک

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'اسم پیج تیک‌تاک'
        required: true
        type: string
      count:
        description: 'تعداد ویدیو'
        required: false
        type: number
        default: 10

permissions:
  contents: write

jobs:
  get-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yt-dlp
        run: |
          pip install -q -U yt-dlp

      - name: Extract TikTok video links
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          COUNT="${{ github.event.inputs.count }}"
          
          # حذف @ از اول اسم اگه باشه
          USERNAME_CLEAN=$(echo "$USERNAME" | sed 's/^@//')
          
          # ساخت پوشه links
          OUTPUT_DIR="links"
          mkdir -p "$OUTPUT_DIR"
          
          # ساخت لینک کامل پروفایل
          PROFILE_URL="https://www.tiktok.com/@${USERNAME_CLEAN}"
          
          echo "در حال گرفتن لینک ویدیوهای ${USERNAME_CLEAN}..."
          
          # استخراج لینک ویدیوها با yt-dlp
          yt-dlp \
            --flat-playlist \
            --print "%(webpage_url)s" \
            --playlist-end "${COUNT}" \
            "$PROFILE_URL" > "${OUTPUT_DIR}/${USERNAME_CLEAN}.txt"
          
          # نمایش تعداد لینک‌های گرفته شده
          LINK_COUNT=$(wc -l < "${OUTPUT_DIR}/${USERNAME_CLEAN}.txt")
          echo "✅ ${LINK_COUNT} لینک ویدیو استخراج شد"
          
          echo "📁 فایل در مسیر ${OUTPUT_DIR}/${USERNAME_CLEAN}.txt ذخیره شد"

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add links/
          git commit -m "Download media [skip ci]" || echo "Nothing to commit"
          git push
