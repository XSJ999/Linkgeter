name: ph dn

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      quality:
        description: 'Video quality (yt-dlp format selector)'
        required: true
        type: string
        default: 'bestvideo[height<=720]+bestaudio/best[ext=mp4]/best'
      archive_name:
        description: 'Base name for the RAR archive (if file is split)'
        required: false
        type: string
        default: 'video'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest
    
    # محدودیت زمان اجرا برای جلوگیری از مصرف بی‌رویه
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp and bc
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y bc

      - name: Validate URL (security)
        id: validate
        run: |
          URL="${{ github.event.inputs.url }}"
          # اعتبارسنجی امنیتی URL
          if [[ ! "$URL" =~ ^https?://[a-zA-Z0-9.-]+(/.*)?$ ]]; then
            echo "Error: Invalid URL format - potential injection attempt"
            exit 1
          fi
          echo "url_cleaned=${URL}" >> $GITHUB_OUTPUT

      - name: Check available disk space
        run: |
          AVAILABLE_GB=$(df --output=avail / | tail -1 | awk '{print $1/1048576}')
          NEEDED_GB=0.5  # حداقل 500 مگابایت فضای آزاد نیاز است
          
          if (( $(echo "$AVAILABLE_GB < $NEEDED_GB" | bc -l) )); then
            echo "Error: Insufficient disk space (${AVAILABLE_GB}GB available, need ${NEEDED_GB}GB)"
            exit 1
          fi
          echo "Available disk space: ${AVAILABLE_GB}GB"

      - name: Download video (retry up to 5 times)
        id: download
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"
          
          # ایجاد دایرکتوری موقت برای ذخیره فایل دانلود شده
          TEMP_DOWNLOAD_DIR=$(mktemp -d)
          
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false
          FINAL_FILE=""

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Download attempt $((RETRY_COUNT+1))/$MAX_RETRIES"
            
            # پاک کردن دایرکتوری موقت در هر تلاش
            rm -rf "$TEMP_DOWNLOAD_DIR"/*
            
            # اجرای دانلود با قالب دقیق خروجی
            yt-dlp \
              --output "$TEMP_DOWNLOAD_DIR/%(uploader)s - %(title)s - %(id)s.%(ext)s" \
              --format "${{ github.event.inputs.quality }}" \
              --merge-output-format mp4 \
              --retries 3 \
              --fragment-retries 10 \
              --no-check-certificate \
              --geo-bypass \
              --no-color \
              --no-progress \
              "${{ steps.validate.outputs.url_cleaned }}" && \
              yt-dlp_exit_code=$? || yt-dlp_exit_code=$?
            
            if [ $yt_dlp_exit_code -eq 0 ]; then
              # پیدا کردن فایل دانلود شده
              DOWNLOADED_FILE=$(find "$TEMP_DOWNLOAD_DIR" -type f -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" | head -1)
              
              if [ -n "$DOWNLOADED_FILE" ] && [ -f "$DOWNLOADED_FILE" ]; then
                FILE_SIZE=$(stat -c %s "$DOWNLOADED_FILE")
                if [ "$FILE_SIZE" -gt 1024 ]; then  # بزرگتر از 1KB
                  SUCCESS=true
                  FINAL_FILE="$DOWNLOADED_FILE"
                  echo "Download succeeded: $(basename "$DOWNLOADED_FILE") (${FILE_SIZE} bytes)"
                  break
                else
                  echo "Downloaded file is too small (${FILE_SIZE} bytes), retrying..."
                fi
              else
                echo "No file found after download, retrying..."
              fi
            else
              echo "yt-dlp exited with code: $yt_dlp_exit_code"
            fi
            
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              WAIT_TIME=$((RETRY_COUNT * 5))  # افزایش تدریجی زمان انتظار
              echo "Waiting ${WAIT_TIME} seconds before next attempt..."
              sleep $WAIT_TIME
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "Error: All $MAX_RETRIES download attempts failed."
            rm -rf "$TEMP_DOWNLOAD_DIR"
            exit 1
          fi

          # انتقال فایل به دایرکتوری نهایی
          FINAL_PATH="$FOLDER/$(basename "$FINAL_FILE")"
          mv "$FINAL_FILE" "$FINAL_PATH"
          
          FILENAME=$(basename "$FINAL_PATH")
          SIZE_BYTES=$(stat -c %s "$FINAL_PATH")
          
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "full_path=$FINAL_PATH" >> $GITHUB_OUTPUT
          echo "Downloaded: $FINAL_PATH (${SIZE_BYTES} bytes)"
          
          # پاکسازی
          rm -rf "$TEMP_DOWNLOAD_DIR"

      - name: Install RAR
        run: sudo apt-get install -y rar

      - name: Conditional split (if file > 99 MB)
        id: split
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          FULL_PATH="${{ steps.download.outputs.full_path }}"
          SIZE_BYTES="${{ steps.download.outputs.size_bytes }}"
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          THRESHOLD_MB=99

          cd "$FOLDER"

          if (( $(echo "$SIZE_MB > $THRESHOLD_MB" | bc -l) )); then
            echo "File size ${SIZE_MB} MB exceeds ${THRESHOLD_MB} MB – splitting into 95 MB RAR parts."
            
            RANDOM_HEX=$(openssl rand -hex 3)
            ARCHIVE_NAME="${{ github.event.inputs.archive_name }}_${RANDOM_HEX}"
            echo "Archive base name: ${ARCHIVE_NAME}"
            
            # ایجاد RAR با بررسی موفقیت
            if rar a -v95m -m5 -ep1 "${ARCHIVE_NAME}.rar" "$FILENAME"; then
              # فقط در صورت موفقیت، فایل اصلی حذف شود
              rm "$FILENAME"
              echo "split_done=true" >> $GITHUB_OUTPUT
              echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
              echo "Split completed. Parts created:"
              ls -lh "${ARCHIVE_NAME}.part"*.rar 2>/dev/null || ls -lh "${ARCHIVE_NAME}.rar"
            else
              echo "Error: RAR compression failed, keeping original file"
              echo "split_done=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "File size ${SIZE_MB} MB is ≤${THRESHOLD_MB} MB – keeping original file (no RAR)."
            echo "split_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to repository (only if changes exist)
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          
          # بررسی وجود تغییرات
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FOLDER/"
            
            # ایجاد پیام commit با اطلاعات ویدیو
            COMMIT_MSG="Add downloaded video"
            if [ "${{ steps.split.outputs.split_done }}" = "true" ]; then
              COMMIT_MSG="${COMMIT_MSG} (split into RAR parts: ${{ steps.split.outputs.archive_name }})"
            fi
            COMMIT_MSG="${COMMIT_MSG} - Size: ${{ steps.download.outputs.size_bytes }} bytes"
            
            git commit -m "$COMMIT_MSG"
            git push
            echo "Changes committed and pushed successfully"
          else
            echo "No changes to commit - skipping push"
          fi

      - name: Cleanup old files (optional)
        if: always()
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          # حذف فایل‌های موقت و قدیمی (اختیاری - فعال کنید در صورت نیاز)
          # find "$FOLDER" -type f -name "*.part*" -mtime +7 -delete
          echo "Cleanup completed (if any)"
