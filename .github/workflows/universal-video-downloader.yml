name: universal-video-downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک مستقیم ویدیو (از هر سایتی که yt-dlp پشتیبانی می‌کند)'
        required: true
        type: string
        
      quality:
        description: 'کیفیت ویدیو'
        required: false
        type: choice
        options:
          - best (بهترین کیفیت)
          - 1080p
          - 720p
          - 480p
          - 360p
          - audio-only (فقط صدا)
        default: 'best (بهترین کیفیت)'
        
      format:
        description: 'فرمت خروجی'
        required: false
        type: choice
        options:
          - mp4
          - mkv
          - webm
          - best (همان فرمت اصلی)
        default: 'mp4'
        
      extract_audio:
        description: 'استخراج فقط صدا (MP3)'
        required: false
        type: boolean
        default: false
        
      audio_quality:
        description: 'کیفیت صدا (در صورت استخراج صدا)'
        required: false
        type: choice
        options:
          - '320k'
          - '256k'
          - '192k'
          - '128k'
          - '64k'
        default: '192k'

permissions:
  contents: write

jobs:
  download-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q -U "yt-dlp[default]"

      - name: Create videos directory
        run: |
          mkdir -p videos
          echo "# 📹 Videos Downloaded with yt-dlp" > videos/README.md
          echo "" >> videos/README.md
          echo "**Download Date:** $(date '+%Y-%m-%d %H:%M:%S')" >> videos/README.md
          echo "**Source URL:** ${{ github.event.inputs.video_url }}" >> videos/README.md
          echo "" >> videos/README.md
          echo "## 📋 Download Log" >> videos/README.md
          echo "" >> videos/README.md
          echo '```' >> videos/README.md

      - name: Download video with yt-dlp
        id: download
        run: |
          URL="${{ github.event.inputs.video_url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          FORMAT="${{ github.event.inputs.format }}"
          EXTRACT_AUDIO="${{ github.event.inputs.extract_audio }}"
          AUDIO_QUALITY="${{ github.event.inputs.audio_quality }}"
          
          # آماده سازی آرگومان‌های کیفیت
          case "$QUALITY" in
            "best (بهترین کیفیت)")
              QUALITY_ARGS="-f bestvideo+bestaudio/best"
              ;;
            "1080p")
              QUALITY_ARGS="-f bestvideo[height<=1080]+bestaudio/best[height<=1080]"
              ;;
            "720p")
              QUALITY_ARGS="-f bestvideo[height<=720]+bestaudio/best[height<=720]"
              ;;
            "480p")
              QUALITY_ARGS="-f bestvideo[height<=480]+bestaudio/best[height<=480]"
              ;;
            "360p")
              QUALITY_ARGS="-f bestvideo[height<=360]+bestaudio/best[height<=360]"
              ;;
            "audio-only (فقط صدا)")
              QUALITY_ARGS="-f bestaudio/best"
              ;;
          esac
          
          # تنظیم فرمت خروجی
          if [ "$FORMAT" != "best (همان فرمت اصلی)" ]; then
            FORMAT_ARGS="--merge-output-format $FORMAT"
          else
            FORMAT_ARGS=""
          fi
          
          # تنظیمات استخراج صدا
          if [ "$EXTRACT_AUDIO" = "true" ] || [ "$QUALITY" = "audio-only (فقط صدا)" ]; then
            AUDIO_ARGS="-x --audio-format mp3 --audio-quality $AUDIO_QUALITY"
            EXTENSION="mp3"
          else
            AUDIO_ARGS=""
            EXTENSION="%(ext)s"
          fi
          
          echo "🔄 شروع دانلود ویدیو از: $URL"
          echo "📊 کیفیت انتخاب شده: $QUALITY"
          
          # دانلود با yt-dlp
          yt-dlp \
            --no-playlist \
            --no-check-certificate \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --retries 10 \
            --fragment-retries 10 \
            --no-warnings \
            --newline \
            $QUALITY_ARGS \
            $FORMAT_ARGS \
            $AUDIO_ARGS \
            -o "videos/%(title)s - %(uploader)s [%(id)s].$EXTENSION" \
            "$URL" 2>&1 | tee download.log
          
          # بررسی موفقیت دانلود
          if [ $? -eq 0 ]; then
            echo "✅ دانلود با موفقیت انجام شد"
            echo "download_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ خطا در دانلود، تلاش با تنظیمات پیش‌فرض..."
            # تلاش مجدد با تنظیمات ساده‌تر
            yt-dlp \
              --no-playlist \
              --no-check-certificate \
              -f best \
              -o "videos/%(title)s.%(ext)s" \
              "$URL"
            
            if [ $? -eq 0 ]; then
              echo "✅ دانلود با تنظیمات پیش‌فرض موفق بود"
              echo "download_success=true" >> $GITHUB_OUTPUT
            else
              echo "download_success=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
          
          # ذخیره لاگ در README
          cat download.log >> videos/README.md

      - name: Log downloaded files
        run: |
          echo '```' >> videos/README.md
          echo "" >> videos/README.md
          echo "## 📁 Downloaded Files" >> videos/README.md
          echo "" >> videos/README.md
          echo '```' >> videos/README.md
          ls -lh videos/ | grep -v "README.md" >> videos/README.md
          echo '```' >> videos/README.md
          
          # ذخیره لیست فایل‌های دانلود شده
          ls videos/ | grep -v "README.md" > videos/file_list.txt

      - name: Generate summary
        run: |
          VIDEO_COUNT=$(find videos/ -type f ! -name "README.md" ! -name "file_list.txt" | wc -l)
          TOTAL_SIZE=$(du -sh videos/ | cut -f1)
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎬 Video Download Summary
          
          | آیتم | مقدار |
          |------|-------|
          | **URL منبع** | ${{ github.event.inputs.video_url }} |
          | **کیفیت درخواستی** | ${{ github.event.inputs.quality }} |
          | **فرمت خروجی** | ${{ github.event.inputs.format }} |
          | **تعداد فایل‌های دانلود شده** | ${VIDEO_COUNT} |
          | **حجم کل** | ${TOTAL_SIZE} |
          | **تاریخ دانلود** | $(date '+%Y-%m-%d %H:%M:%S') |
          
          > 💡 ویدیوها در پوشه \`videos/\` ذخیره شده‌اند
          > 🔗 برای مشاهده لاگ کامل به فایل \`videos/README.md\` مراجعه کنید
          EOF
          
          # نمایش لیست فایل‌ها در summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📹 فایل‌های دانلود شده:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh videos/ | grep -v "README.md" | grep -v "file_list.txt" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit and push videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git commit -m "Download video: ${{ github.event.inputs.video_url }} [skip ci]" || echo "Nothing to commit"
          git push

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-videos
          path: videos/
          retention-days: 30
