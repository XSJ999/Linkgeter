name: دانلودر اینستاگرام پیشرفته

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک پست اینستاگرام (تک پست یا پروفایل)'
        required: true
        type: string

      output_format:
        description: 'نوع خروجی'
        required: true
        type: choice
        options:
          - mp4 (ویدیو با صدا)
          - mp3 (فقط صدا)
          - best (خودکار)
        default: 'mp4 (ویدیو با صدا)'

      video_quality:
        description: 'حداکثر کیفیت ویدیو برای دانلود'
        required: false
        type: choice
        options:
          - '2160 (4K)'
          - '1080 (Full HD)'
          - '720 (HD)'
          - '480'
          - '360'
          - '144'
          - 'best'
        default: '1080 (Full HD)'

      audio_quality:
        description: 'کیفیت صدا (فقط برای mp3)'
        required: false
        type: choice
        options:
          - '320'
          - '192'
          - '128'
          - '64'
        default: '192'

      video_codec:
        description: 'کدک ویدیویی ترجیحی (نادیده گرفته شود برای فقط صدا)'
        required: false
        type: choice
        options:
          - 'any (auto)'
          - 'h264 (MP4 compatible)'
          - 'vp9'
          - 'av1'
        default: 'any (auto)'

      concurrent_fragments:
        description: 'تکه‌های دانلود موازی — بیشتر = سریعتر ولی پهنای باند بیشتر'
        required: false
        type: choice
        options:
          - '4'
          - '8'
          - '16'
          - '1'
        default: '4'

      sponsorblock:
        description: 'پرش بخش‌های اسپانسر / اینترو / ائوترو'
        required: false
        type: boolean
        default: false

      embed_chapters:
        description: 'قراردادن نشانگرهای فصل در فایل خروجی'
        required: false
        type: boolean
        default: true

      write_description:
        description: 'ذخیره توضیحات ویدیو به عنوان فایل .description'
        required: false
        type: boolean
        default: false

      trim_start:
        description: 'زمان شروع برش (مثل 0:33 یا 1:22:10) — خالی بذار برای عدم برش'
        required: false
        type: string

      trim_end:
        description: 'زمان پایان برش (مثل 1:22 یا 2:00:00) — خالی بذار برای عدم برش'
        required: false
        type: string

      playlist_items:
        description: |
          آیتم‌های پلی‌لیست برای دانلود:
          خالی = فقط تک ویدیو
          all = کل پروفایل
          3-7 = آیتم‌های 3 تا 7
          1,3,5 = آیتم‌های مشخص
        required: false
        type: string

      cookies:
        description: |
          رشته کوکی (فرمت Netscape) برای دور زدن محدودیت‌های سنی/جغرافیایی.
        required: false
        type: string

      download_subtitles:
        description: 'دانلود فایل‌های زیرنویس'
        required: false
        type: boolean
        default: false

      subtitle_langs:
        description: 'زبان‌های زیرنویس، با کاما جدا شده (مثل en,fa)'
        required: false
        type: string
        default: 'en'

      embed_metadata:
        description: 'قراردادن تصویر بند انگشتی و متادیتا در فایل خروجی'
        required: false
        type: boolean
        default: true

      max_part_mb:
        description: 'حداکثر اندازه هر قسمت به مگابایت برای تقسیم (0 = عدم تقسیم)'
        required: false
        type: number
        default: 90

      output_folder:
        description: 'پوشه برای ذخیره دانلودها (نسبت به ریشه ریپازیتوری)'
        required: false
        type: string
        default: 'instagram'

      extra_args:
        description: 'آرگومان‌های اضافی yt-dlp (برای کاربران حرفه‌ای)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg zip
          pip install -q -U "yt-dlp[default]"

      - name: Download media
        run: |
          URL="${{ github.event.inputs.video_url }}"
          FORMAT_INPUT="${{ github.event.inputs.output_format }}"
          VIDEO_QUALITY="${{ github.event.inputs.video_quality }}"
          AUDIO_Q="${{ github.event.inputs.audio_quality }}"
          CODEC="${{ github.event.inputs.video_codec }}"
          FRAGMENTS="${{ github.event.inputs.concurrent_fragments }}"
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"
          TRIM_START="${{ github.event.inputs.trim_start }}"
          TRIM_END="${{ github.event.inputs.trim_end }}"
          PLAYLIST_ITEMS="${{ github.event.inputs.playlist_items }}"
          SUBTITLES="${{ github.event.inputs.download_subtitles }}"
          SUB_LANGS="${{ github.event.inputs.subtitle_langs }}"
          EMBED_META="${{ github.event.inputs.embed_metadata }}"
          EMBED_CHAPTERS="${{ github.event.inputs.embed_chapters }}"
          SPONSORBLOCK="${{ github.event.inputs.sponsorblock }}"
          WRITE_DESC="${{ github.event.inputs.write_description }}"
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"

          mkdir -p "$OUTPUT_FOLDER"

          # Cookie handling
          COOKIE_ARGS=""
          if [ -n "$INPUT_COOKIES" ]; then
            printf '%s' "$INPUT_COOKIES" > /tmp/cookies.txt
            COOKIE_ARGS="--cookies /tmp/cookies.txt"
          fi

          # Extract numeric height from quality string
          QUALITY_NUM=$(echo "$VIDEO_QUALITY" | grep -o '[0-9]*' | head -1)

          # Codec filter
          case "$CODEC" in
            "h264 (MP4 compatible)") CODEC_FILTER="[vcodec^=avc]" ; MERGE_FMT="mp4" ;;
            "vp9")                   CODEC_FILTER="[vcodec^=vp9]" ; MERGE_FMT="mkv" ;;
            "av1")                   CODEC_FILTER="[vcodec^=av01]"; MERGE_FMT="mkv" ;;
            *)                       CODEC_FILTER=""               ; MERGE_FMT="mp4" ;;
          esac

          # Format / quality selection
          if [ "$FORMAT_INPUT" = "mp3 (فقط صدا)" ]; then
            FORMAT_ARGS="-x --audio-format mp3 --audio-quality ${AUDIO_Q}K"
          elif [ "$FORMAT_INPUT" = "best (خودکار)" ] || [ "$VIDEO_QUALITY" = "best" ]; then
            FORMAT_ARGS="-f bestvideo+bestaudio --merge-output-format mp4"
          else
            if [ -n "$CODEC_FILTER" ]; then
              FORMAT_ARGS="-f bestvideo[height<=${QUALITY_NUM}]${CODEC_FILTER}+bestaudio/bestvideo[height<=${QUALITY_NUM}]+bestaudio/best[height<=${QUALITY_NUM}] --merge-output-format ${MERGE_FMT}"
            else
              FORMAT_ARGS="-f bestvideo[height<=${QUALITY_NUM}]+bestaudio/best[height<=${QUALITY_NUM}] --merge-output-format mp4"
            fi
          fi

          # Trim / section
          SECTION_ARGS=""
          if [ -n "$TRIM_START" ] && [ -n "$TRIM_END" ]; then
            SECTION_ARGS="--download-sections *${TRIM_START}-${TRIM_END} --force-keyframes-at-cuts"
          elif [ -n "$TRIM_START" ]; then
            SECTION_ARGS="--download-sections *${TRIM_START}-inf --force-keyframes-at-cuts"
          elif [ -n "$TRIM_END" ]; then
            SECTION_ARGS="--download-sections *0-${TRIM_END} --force-keyframes-at-cuts"
          fi

          # Playlist range
          PLAYLIST_ARGS="--no-playlist"
          if [ -n "$PLAYLIST_ITEMS" ]; then
            if [ "$PLAYLIST_ITEMS" = "all" ]; then
              PLAYLIST_ARGS=""
            else
              PLAYLIST_ARGS="--playlist-items $PLAYLIST_ITEMS"
            fi
          fi

          # Subtitles
          SUBTITLE_ARGS=""
          if [ "$SUBTITLES" = "true" ]; then
            SUBTITLE_ARGS="--write-subs --write-auto-subs --sub-langs ${SUB_LANGS}"
          fi

          # Metadata / thumbnail embedding
          META_ARGS=""
          if [ "$EMBED_META" = "true" ]; then
            META_ARGS="--embed-thumbnail --embed-metadata --add-metadata"
          fi

          # Chapter markers
          CHAPTER_ARGS=""
          if [ "$EMBED_CHAPTERS" = "true" ]; then
            CHAPTER_ARGS="--embed-chapters"
          fi

          # SponsorBlock
          SPONSOR_ARGS=""
          if [ "$SPONSORBLOCK" = "true" ]; then
            SPONSOR_ARGS="--sponsorblock-remove sponsor,intro,outro,selfpromo,interaction"
          fi

          # Description file
          DESC_ARGS=""
          if [ "$WRITE_DESC" = "true" ]; then
            DESC_ARGS="--write-description"
          fi

          yt-dlp \
            --newline \
            --extractor-args "instagram:embed_logger" \
            --concurrent-fragments "${FRAGMENTS}" \
            $FORMAT_ARGS \
            $SECTION_ARGS \
            $SUBTITLE_ARGS \
            $META_ARGS \
            $CHAPTER_ARGS \
            $SPONSOR_ARGS \
            $DESC_ARGS \
            $PLAYLIST_ARGS \
            $COOKIE_ARGS \
            -o "$OUTPUT_FOLDER/%(title)s [%(id)s].%(ext)s" \
            $EXTRA_ARGS \
            "$URL"
        env:
          INPUT_COOKIES: ${{ github.event.inputs.cookies }}

      - name: Split oversized files (optional)
        run: |
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"
          THRESH_MB=${{ github.event.inputs.max_part_mb }}
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))

          for f in "$OUTPUT_FOLDER"/*; do
            [ -f "$f" ] || continue
            fs=$(stat -c%s "$f")
            fname=$(basename "$f")
            if [ "$THRESH_BYTES" -gt 0 ] && [ "$fs" -gt "$THRESH_BYTES" ]; then
              zip -j -s "${THRESH_MB}m" "$OUTPUT_FOLDER/${fname}.zip" "$f"
              rm "$f"
            fi
          done

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}/"
          git commit -m "Download media [skip ci]" || echo "Nothing to commit"
          git push
