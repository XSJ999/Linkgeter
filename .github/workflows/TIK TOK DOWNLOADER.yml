name: tiktok downloader

on:
  workflow_dispatch:
    inputs:
      input_type:
        description: 'Input type'
        required: true
        type: choice
        options:
          - single_video (direct URL)
          - profile (username ID)
        default: 'single_video (direct URL)'

      video_url:
        description: 'TikTok URL (video) - required for single video mode'
        required: false
        type: string

      profile_username:
        description: 'TikTok username (e.g. @username or just username) - required for profile mode'
        required: false
        type: string

      max_videos:
        description: 'Maximum videos to download from profile (1-50)'
        required: false
        type: number
        default: 10

      output_format:
        description: 'Output format'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      video_quality:
        description: 'Video quality (TikTok max is usually 1080p)'
        required: false
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - '360'
          - 'best'
        default: '1080'

      audio_quality:
        description: 'Audio bitrate — applies to MP3 downloads'
        required: false
        type: choice
        options:
          - '320'
          - '192'
          - '128'
          - '64'
        default: '192'

      concurrent_fragments:
        description: 'Parallel download fragments — more = faster but higher bandwidth'
        required: false
        type: choice
        options:
          - '4'
          - '8'
          - '16'
          - '1'
        default: '4'

      embed_metadata:
        description: 'Embed thumbnail and metadata into the output file'
        required: false
        type: boolean
        default: true

      write_description:
        description: 'Save video description as a .description text file'
        required: false
        type: boolean
        default: false

      trim_start:
        description: 'Trim start timestamp (e.g. 0:33 or 1:22) — leave empty to skip'
        required: false
        type: string

      trim_end:
        description: 'Trim end timestamp (e.g. 1:22 or 2:00) — leave empty to skip'
        required: false
        type: string

      download_subtitles:
        description: 'Download subtitle files (if available)'
        required: false
        type: boolean
        default: false

      subtitle_langs:
        description: 'Subtitle languages, comma-separated (e.g. en,ar)'
        required: false
        type: string
        default: 'en'

      output_folder:
        description: 'Folder to store downloads (relative to repo root)'
        required: false
        type: string
        default: 'tiktoks'

      extra_args:
        description: 'Extra yt-dlp arguments (advanced users)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg zip
          pip install -q -U "yt-dlp[default]"

      - name: Validate inputs
        run: |
          INPUT_TYPE="${{ github.event.inputs.input_type }}"
          
          if [ "$INPUT_TYPE" = "single_video (direct URL)" ] && [ -z "${{ github.event.inputs.video_url }}" ]; then
            echo "Error: video_url is required for single video mode"
            exit 1
          fi
          
          if [ "$INPUT_TYPE" = "profile (username ID)" ] && [ -z "${{ github.event.inputs.profile_username }}" ]; then
            echo "Error: profile_username is required for profile mode"
            exit 1
          fi
          
          MAX_VIDEOS="${{ github.event.inputs.max_videos }}"
          if [ "$MAX_VIDEOS" -lt 1 ] || [ "$MAX_VIDEOS" -gt 50 ]; then
            echo "Error: max_videos must be between 1 and 50"
            exit 1
          fi

      - name: Prepare download URL
        id: prepare_url
        run: |
          INPUT_TYPE="${{ github.event.inputs.input_type }}"
          
          if [ "$INPUT_TYPE" = "single_video (direct URL)" ]; then
            echo "download_url=${{ github.event.inputs.video_url }}" >> $GITHUB_OUTPUT
            echo "playlist_mode=false" >> $GITHUB_OUTPUT
          else
            # Format username (remove @ if present)
            USERNAME="${{ github.event.inputs.profile_username }}"
            USERNAME="${USERNAME#@}"
            # TikTok profile URL for playlist
            echo "download_url=https://www.tiktok.com/@${USERNAME}" >> $GITHUB_OUTPUT
            echo "playlist_mode=true" >> $GITHUB_OUTPUT
          fi

      - name: Download media
        run: |
          DOWNLOAD_URL="${{ steps.prepare_url.outputs.download_url }}"
          INPUT_TYPE="${{ github.event.inputs.input_type }}"
          FORMAT_INPUT="${{ github.event.inputs.output_format }}"
          VIDEO_QUALITY="${{ github.event.inputs.video_quality }}"
          AUDIO_Q="${{ github.event.inputs.audio_quality }}"
          FRAGMENTS="${{ github.event.inputs.concurrent_fragments }}"
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"
          TRIM_START="${{ github.event.inputs.trim_start }}"
          TRIM_END="${{ github.event.inputs.trim_end }}"
          SUBTITLES="${{ github.event.inputs.download_subtitles }}"
          SUB_LANGS="${{ github.event.inputs.subtitle_langs }}"
          EMBED_META="${{ github.event.inputs.embed_metadata }}"
          WRITE_DESC="${{ github.event.inputs.write_description }}"
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"
          IS_PLAYLIST="${{ steps.prepare_url.outputs.playlist_mode }}"
          MAX_VIDEOS="${{ github.event.inputs.max_videos }}"

          mkdir -p "$OUTPUT_FOLDER"

          # Format / quality selection for TikTok
          if [ "$FORMAT_INPUT" = "mp3 (audio only)" ]; then
            FORMAT_ARGS="-x --audio-format mp3 --audio-quality ${AUDIO_Q}K"
          else
            # TikTok video quality (max 1080p)
            if [ "$VIDEO_QUALITY" = "best" ]; then
              FORMAT_ARGS="-f bestvideo+bestaudio/best"
            else
              FORMAT_ARGS="-f bestvideo[height<=${VIDEO_QUALITY}]+bestaudio/best[height<=${VIDEO_QUALITY}]"
            fi
          fi

          # Trim / section
          SECTION_ARGS=""
          if [ -n "$TRIM_START" ] && [ -n "$TRIM_END" ]; then
            SECTION_ARGS="--download-sections *${TRIM_START}-${TRIM_END} --force-keyframes-at-cuts"
          elif [ -n "$TRIM_START" ]; then
            SECTION_ARGS="--download-sections *${TRIM_START}-inf --force-keyframes-at-cuts"
          elif [ -n "$TRIM_END" ]; then
            SECTION_ARGS="--download-sections *0-${TRIM_END} --force-keyframes-at-cuts"
          fi

          # Playlist settings for profile
          PLAYLIST_ARGS="--no-playlist"
          if [ "$IS_PLAYLIST" = "true" ]; then
            PLAYLIST_ARGS="--playlist-end ${MAX_VIDEOS}"
            # Add retry mechanism for rate limiting
            PLAYLIST_ARGS="${PLAYLIST_ARGS} --retries 5 --fragment-retries 10 --sleep-requests 2 --sleep-interval 3 --max-sleep-interval 8"
          fi

          # Subtitles
          SUBTITLE_ARGS=""
          if [ "$SUBTITLES" = "true" ]; then
            SUBTITLE_ARGS="--write-subs --write-auto-subs --sub-langs ${SUB_LANGS}"
          fi

          # Metadata / thumbnail embedding
          META_ARGS=""
          if [ "$EMBED_META" = "true" ]; then
            META_ARGS="--embed-thumbnail --embed-metadata --add-metadata"
          fi

          # Description file
          DESC_ARGS=""
          if [ "$WRITE_DESC" = "true" ]; then
            DESC_ARGS="--write-description"
          fi

          # TikTok-specific extractor arguments
          EXTRACTOR_ARGS="tiktok:embed_logger=True"
          
          # Add extra headers to avoid rate limiting
          HEADER_ARGS="--add-header User-Agent:Mozilla/5.0 --add-header Accept-Language:en-US,en;q=0.9"

          # Execute download with error handling
          echo "Starting download from: $DOWNLOAD_URL"
          
          yt-dlp \
            --no-check-certificate \
            --newline \
            --no-warnings \
            --extractor-args "$EXTRACTOR_ARGS" \
            --concurrent-fragments "${FRAGMENTS}" \
            --retries 10 \
            --fragment-retries 10 \
            --skip-unavailable-fragments \
            --abort-on-unavailable-fragment \
            --throttledratelimit 1000000 \
            $HEADER_ARGS \
            $FORMAT_ARGS \
            $SECTION_ARGS \
            $SUBTITLE_ARGS \
            $META_ARGS \
            $DESC_ARGS \
            $PLAYLIST_ARGS \
            -o "$OUTPUT_FOLDER/%(uploader)s - %(title)s [%(id)s].%(ext)s" \
            $EXTRA_ARGS \
            "$DOWNLOAD_URL" || {
              echo "Download failed, trying with mobile API..."
              # Fallback to mobile API
              yt-dlp \
                --extractor-args "tiktok:api_hostname=www.tiktok.com" \
                --add-header "User-Agent: TikTok 22.1.3" \
                $FORMAT_ARGS \
                -o "$OUTPUT_FOLDER/%(uploader)s - %(title)s [%(id)s].%(ext)s" \
                "$DOWNLOAD_URL"
            }

      - name: Clean sensitive data
        if: always()
        run: |
          # Clean any temporary files
          rm -f /tmp/cookies.txt 2>/dev/null || true
          rm -f /tmp/*cookie* 2>/dev/null || true

      - name: Create summary
        run: |
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"
          echo "## Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Input Type:** ${{ github.event.inputs.input_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Output Folder:** \`$OUTPUT_FOLDER\`" >> $GITHUB_STEP_SUMMARY
          echo "**Total Files:** $(find "$OUTPUT_FOLDER" -type f ! -name "*.zip" | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloaded Files:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh "$OUTPUT_FOLDER" | grep -v "^total" | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}/"
          git commit -m "Download TikTok media [skip ci]" || echo "Nothing to commit"
          git push
